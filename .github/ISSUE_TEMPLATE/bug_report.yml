name: Bug report
description: Report something in Krelzox that does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
        **Security vulnerabilities must not be reported here** — follow [SECURITY.md](https://github.com/Nach0t/Krelzox-OS/blob/main/SECURITY.md) instead.
        Remove IP addresses, account names and other personal data from logs and screenshots.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the remote keys you pressed (D-pad, OK, Back, Home).
      placeholder: |
        1. Open the Library tab
        2. Press OK on an app
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home screen
        - Library / Media
        - Favorites
        - Performance monitor
        - Settings / Appearance
        - Screensaver
        - Safe mode / HOME role
        - Build / CI
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and system
      description: Device model, Android version and ROM build.
      placeholder: Raspberry Pi 5, LineageOS 24.0 (Android TV 17), KonstaKANG rpi5_tv
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Krelzox version or commit
      description: Shown in Settings › About, or the commit you built from.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Relevant `adb logcat` output or screenshots, with personal data removed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed personal data (IP addresses, accounts, serial numbers) from logs and screenshots.
          required: true
