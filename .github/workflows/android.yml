# Nexium CI: everything that can be checked without a device.
# Device-only checks (UI tests, Baseline Profile, Macrobenchmark) run on the
# Raspberry Pi by hand; see docs/rendimiento.md.
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and validates the wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # gradlew is stored without the executable bit (committed from Windows).
      - run: chmod +x gradlew

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Release build (R8 + Baseline Profile)
        run: ./gradlew assembleRelease

      - name: Compile device tests (UI tests, Baseline Profile, benchmarks)
        run: ./gradlew :app:assembleDebugAndroidTest :baselineprofile:assemble

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Release APK (unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: nexium-release-unsigned
          path: app/build/outputs/apk/release/*.apk
