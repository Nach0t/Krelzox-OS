# Krelzox CI: everything that can be checked without a device.
# Device-only checks (UI tests, Baseline Profile, Macrobenchmark) run on the
# Raspberry Pi by hand; see docs/rendimiento.md.
name: Android CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "third_party/**/*.txt"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "third_party/**/*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Gradle cache (written only from main) and wrapper checksum validation.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Release build (R8 + Baseline Profile)
        run: ./gradlew assembleRelease

      - name: Compile device tests (UI tests, Baseline Profile, benchmarks)
        run: ./gradlew :app:assembleDebugAndroidTest :baselineprofile:assemble

      - name: Summary
        if: always()
        run: python3 .github/scripts/ci_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: krelzox-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  # Sends the resolved Gradle dependencies to GitHub, so Dependabot can raise
  # security alerts for them (the version catalog alone is not enough).
  dependencies:
    name: Dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/dependency-submission@v6
